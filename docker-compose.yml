services:
  teamspeak-web:
    build:
      context: .
      dockerfile: apps/ts3-server/Dockerfile
    container_name: ts3-web
    restart: unless-stopped
    expose:
      - "3333"
    environment:
      TZ: UTC
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: info
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      APP_URL: ${APP_URL:-https://ts.slovekpixel.ru}
      DOMAIN: ${DOMAIN:-ts.slovekpixel.ru}
      TS3_QUERY_HOST: teamspeak
      TS3_QUERY_USER: ${TS3_QUERY_USER:-serveradmin}
      TS3_PASSWORD: ${TS3_PASSWORD:?Set TS3_PASSWORD in .env}
    depends_on:
      - teamspeak

  teamspeak:
    image: teamspeak:3.13.8
    container_name: ts3-voice
    restart: unless-stopped
    ports:
      - "9987:9987/udp" # voice
      - "30033:30033" # file transfer
      - "127.0.0.1:10011:10011" # ServerQuery (localhost only)
    environment:
      TS3SERVER_LICENSE: accept
      TS3SERVER_QUERY_PROTOCOLS: raw
    # serveradmin_password applies on first init of the data volume
    command:
      - ts3server
      - serveradmin_password=${TS3_PASSWORD:?Set TS3_PASSWORD in .env}
    volumes:
      - teamspeak-data:/var/ts3server

  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-ts.slovekpixel.ru}
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - teamspeak-web

  certbot:
    image: certbot/certbot:v3.1.0
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # One-shot by default; use deploy/certbot/init-certs.sh and renew.sh
    profiles:
      - certbot

volumes:
  teamspeak-data:
  certbot-etc:
  certbot-www:
